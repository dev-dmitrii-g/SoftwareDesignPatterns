<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hospital Admission</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="/app.css" rel="stylesheet">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="container py-4">
    <header class="mb-4">
      <h1 class="h3 mb-4">Hospital Admission</h1>
      <nav class="nav nav-tabs" aria-label="Sections">
        <button id="tab-admissions" class="nav-link active" type="button" aria-selected="true" aria-controls="panel-admissions">Admissions</button>
        <button id="tab-stock" class="nav-link" type="button" aria-selected="false" aria-controls="panel-stock">Stock</button>
      </nav>
    </header>

    <div id="notice" class="alert d-none" role="status" aria-live="polite"></div>

    <main>
      <section id="panel-admissions">
        <div class="card mb-4">
          <div class="card-body">
            <h2 class="h5 mb-3">New admission</h2>
            <form id="admission-form">
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label" for="admission-id">Admission ID</label>
                  <input class="form-control" id="admission-id" name="id" required autocomplete="off">
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="iin">IIN</label>
                  <input class="form-control" id="iin" name="iin" inputmode="numeric" pattern="[0-9]{12}" maxlength="12" placeholder="12 digits" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="policy">Policy</label>
                  <input class="form-control" id="policy" name="policy" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="equipment">Equipment</label>
                  <select class="form-select" id="equipment" name="equipment" required><option value="">Choose equipment</option></select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="medicine">Medicine</label>
                  <select class="form-select" id="medicine" name="medicine" required><option value="">Choose medicine</option></select>
                </div>
              </div>
              <div class="d-flex gap-2 mt-3">
                <button class="btn btn-primary" type="button" data-admission-action="admit">Admit</button>
                <button class="btn btn-outline-primary" type="button" data-admission-action="start">Verify only</button>
              </div>
            </form>
          </div>
        </div>

        <div class="card mb-4">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h5 mb-0">Admissions</h2>
              <button id="refresh" class="btn btn-outline-secondary btn-sm" type="button">Refresh</button>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead><tr><th>ID</th><th>IIN</th><th>Policy</th><th>Equipment</th><th>Medicine</th><th>Status</th><th></th></tr></thead>
                <tbody id="admission-rows"><tr><td colspan="7" class="text-secondary">Loading</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="detail" class="card d-none">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 id="detail-id" class="h5 mb-0"></h2>
              <span id="detail-status"></span>
            </div>
            <div class="table-responsive">
              <table class="table table-bordered mb-3">
                <thead><tr><th>Insurance</th><th>Equipment</th><th>Pharmacy</th></tr></thead>
                <tbody><tr><td id="detail-insurance"></td><td id="detail-equipment"></td><td id="detail-pharmacy"></td></tr></tbody>
              </table>
            </div>
            <p id="detail-reason" class="text-danger d-none"></p>
            <div class="d-flex gap-2">
              <button id="resume" class="btn btn-primary btn-sm" type="button">Resume</button>
              <button id="compensate" class="btn btn-outline-danger btn-sm" type="button">Compensate</button>
            </div>
          </div>
        </div>
      </section>

      <section id="panel-stock" class="d-none">
        <div class="row g-4">
          <div class="col-lg-6">
            <div class="card h-100">
              <div class="card-body">
                <h2 class="h5 mb-3">Equipment</h2>
                <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead><tr><th>Name</th><th>Quantity</th><th></th></tr></thead>
                    <tbody id="equipment-rows"><tr><td colspan="3" class="text-secondary">Loading</td></tr></tbody>
                  </table>
                </div>
                <form id="equipment-form" class="row g-2 align-items-end mt-2">
                  <div class="col-sm-6">
                    <label class="form-label" for="equipment-name">New equipment</label>
                    <input class="form-control" id="equipment-name" name="name" required>
                  </div>
                  <div class="col-sm-3">
                    <label class="form-label" for="equipment-quantity">Quantity</label>
                    <input class="form-control" id="equipment-quantity" name="quantity" type="number" min="0" value="1" required>
                  </div>
                  <div class="col-sm-3"><button class="btn btn-primary w-100" type="submit">Add</button></div>
                </form>
              </div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="card h-100">
              <div class="card-body">
                <h2 class="h5 mb-3">Medicine</h2>
                <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead><tr><th>Name</th><th>Quantity</th><th></th></tr></thead>
                    <tbody id="medicine-rows"><tr><td colspan="3" class="text-secondary">Loading</td></tr></tbody>
                  </table>
                </div>
                <form id="medicine-form" class="row g-2 align-items-end mt-2">
                  <div class="col-sm-6">
                    <label class="form-label" for="medicine-name">New medicine</label>
                    <input class="form-control" id="medicine-name" name="name" required>
                  </div>
                  <div class="col-sm-3">
                    <label class="form-label" for="medicine-quantity">Quantity</label>
                    <input class="form-control" id="medicine-quantity" name="quantity" type="number" min="0" value="1" required>
                  </div>
                  <div class="col-sm-3"><button class="btn btn-primary w-100" type="submit">Add</button></div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
