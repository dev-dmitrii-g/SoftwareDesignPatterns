<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#17212b} .title{font-size:25px;font-weight:bold}.head{font-size:17px;font-weight:bold}.small{font-size:14px}.box{fill:#f8fbff;stroke:#55718a;stroke-width:2}.sub{fill:#f4f8fb;stroke:#8aa0b2;stroke-width:2}.line{stroke:#55718a;stroke-width:2;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#55718a"/></marker></defs>
<text x="35" y="43" class="title">Hospital Admission Facade Class Diagram</text>
<rect x="35" y="80" width="165" height="65" rx="7" class="box"/><text x="55" y="119" class="head">CLI Client</text>
